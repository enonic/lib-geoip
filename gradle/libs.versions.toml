[versions]
graalvm = "25.0.3"
jackson = "2.22.1"
junit = "6.1.2"
maxmind = "4.1.0"

[libraries]
graalvm-js       = { module = "org.graalvm.polyglot:js",                    version.ref = "graalvm" }
